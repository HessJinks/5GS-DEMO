{{- if .Values.open5gs.upf.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: upf-config
  namespace: {{ .Values.global.namespace }}
data:
  upf.yaml: |
    logger:
      level: info

    upf:
      pfcp:
        server:
          - address: 0.0.0.0
            advertise: {{ include "open5gs-5g.serviceFQDN" (dict "name" "upf" "root" .) }}
      gtpu:
        server:
          - address: 0.0.0.0
            advertise: {{ include "open5gs-5g.serviceFQDN" (dict "name" "upf" "root" .) }}
      session:
        - subnet: {{ .Values.network.ueSubnet }}
          gateway: {{ .Values.network.gateway }}
      metrics:
        server:
          - address: 0.0.0.0
            port: 9090
{{- end }}
